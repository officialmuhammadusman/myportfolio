<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none" >

<style>
  .pulse { transform-origin: 50px 50px; animation: pulse 1.6s ease-in-out infinite; }
  .halo { transform-origin: 50px 50px; animation: halo 1.6s ease-out infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(.96); opacity: .92; }
    50% { transform: scale(1.03); opacity: 1; }
  }
  @keyframes halo {
    0% { transform: scale(.7); opacity: .55; }
    100% { transform: scale(1.25); opacity: 0; }
  }
</style>
<circle class="halo" cx="50" cy="50" r="36" stroke="#FF6A00" stroke-width="2"/>
<g class="pulse">
<g id="mu-mark">
  <defs>
    <linearGradient id="muGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="78%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
  </defs>
  <path d="M12 88V20L46 48L60 37V88H48V58L46 60L24 42V88Z" fill="url(#muGradient)"/>
  <path d="M60 54V88H88V31H76V73C76 78 72 82 67 82C63 82 60 78 60 74V54Z" fill="url(#muGradient)"/>
  <path d="M76 18L88 10V25L76 33Z" fill="#FFB347"/>
</g>
</g>

</svg>